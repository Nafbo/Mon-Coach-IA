[project]
name = "mcp-garmin-coach"
version = "0.1.0"
description = "Serveur MCP distant exposant des données Garmin Connect et un état opérationnel de coaching triathlon"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "garminconnect>=0.3.2",
    "pydantic>=2.0.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
